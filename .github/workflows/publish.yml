# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: publish

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_nuget:
        description: Publish a stable release to NuGet.org
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  packages: write
  contents: read

jobs:
  publish:
    name: Pack and Publish (.NET)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore DotNetAgentSurface.slnx

      - name: Build
        run: dotnet build DotNetAgentSurface.slnx --no-restore --configuration Release

      - name: Pack
        run: dotnet pack DotNetAgentSurface.slnx --no-build --no-restore --configuration Release --output ./artifacts

      - name: Publish to GitHub Packages
        run: |
          foreach ($file in (Get-ChildItem ./artifacts -Recurse -Filter *.nupkg)) {
            dotnet nuget push $file.FullName `
              --source https://nuget.pkg.github.com/sommmen/index.json `
              --api-key "${{ github.token }}" `
              --skip-duplicate `
              --no-symbols
          }

      - name: Summarize published packages
        if: always()
        shell: pwsh
        run: |
          $packages = Get-ChildItem ./artifacts -Recurse -Filter *.nupkg |
            Where-Object { $_.Name -notlike '*.symbols.nupkg' } |
            ForEach-Object {
              if ($_.Name -match '^(?<id>.+)\.(?<version>\d+\.\d+\.\d+(?:[-+].+)?)\.nupkg$') {
                "| $($Matches['id']) | $($Matches['version']) |"
              }
            }

          "## Published preview packages" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| Package | Version |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| --- | --- |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($packages) {
            $packages | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          else {
            "| _No package artifacts found_ | — |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: NuGet login (OIDC to temporary API key)
        if: >-
          ((github.event_name == 'release' && !github.event.release.prerelease) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_nuget))
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet package
        if: steps.nuget-login.outputs.NUGET_API_KEY != ''
        env:
          NuGetDirectory: ./artifacts
        run: |
          foreach($file in (Get-ChildItem "${{ env.NuGetDirectory }}" -Recurse -Include *.nupkg)) {
              dotnet nuget push $file --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
          }
