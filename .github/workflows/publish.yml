# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: publish

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_nuget:
        description: Publish this build to NuGet.org (pushes to main always publish)
        required: true
        default: false
        type: boolean

permissions:
  id-token: write
  packages: write
  contents: read

# Serialise publishes so two pushes to main never race on the same package versions; queued runs wait rather than cancel.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, Test and Pack (.NET)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"

      - name: Restore dependencies
        run: dotnet restore DotNetAgentSurface.slnx

      - name: Build
        run: dotnet build DotNetAgentSurface.slnx --no-restore --configuration Release

      - name: Run tests
        run: dotnet test DotNetAgentSurface.slnx --no-build --no-restore --configuration Release --verbosity normal --report-gh

      - name: Pack
        run: dotnet pack DotNetAgentSurface.slnx --no-build --no-restore --configuration Release --output ./artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: ./artifacts
          if-no-files-found: error

  publish:
    name: Publish (.NET)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      packages: write
      contents: read

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: ./artifacts

      - name: Publish to GitHub Packages
        run: |
          foreach ($file in (Get-ChildItem ./artifacts -Recurse -Filter *.nupkg)) {
            dotnet nuget push $file.FullName `
              --source https://nuget.pkg.github.com/sommmen/index.json `
              --api-key "${{ github.token }}" `
              --skip-duplicate `
              --no-symbols
          }

      - name: Summarize published packages
        if: always()
        shell: pwsh
        run: |
          $packages = Get-ChildItem ./artifacts -Recurse -Filter *.nupkg |
            Where-Object { $_.Name -notlike '*.symbols.nupkg' } |
            ForEach-Object {
              if ($_.Name -match '^(?<id>.+)\.(?<version>\d+\.\d+\.\d+(?:[-+].+)?)\.nupkg$') {
                "| $($Matches['id']) | $($Matches['version']) |"
              }
            }

          "## Published preview packages" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| Package | Version |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "| --- | --- |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          if ($packages) {
            $packages | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
          else {
            "| _No package artifacts found_ | — |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: NuGet login (OIDC to temporary API key)
        if: >-
          (github.event_name == 'push' ||
          (github.event_name == 'release' && !github.event.release.prerelease) ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_nuget))
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet package
        if: steps.nuget-login.outputs.NUGET_API_KEY != ''
        env:
          NuGetDirectory: ./artifacts
        run: |
          foreach($file in (Get-ChildItem "${{ env.NuGetDirectory }}" -Recurse -Include *.nupkg)) {
              dotnet nuget push $file --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
          }
