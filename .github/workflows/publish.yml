# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  packages: write
  contents: read

jobs:
  publish:
    name: Pack and Publish (.NET)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore DotNetAgentSurface.slnx

      - name: Build
        run: dotnet build DotNetAgentSurface.slnx --no-restore --configuration Release

      - name: Pack
        run: dotnet pack DotNetAgentSurface.slnx --no-build --configuration Release --output ./artifacts

      - name: Publish to GitHub Packages
        run: dotnet nuget push "./artifacts/*.nupkg" --source https://nuget.pkg.github.com/sommmen/index.json --api-key ${{ github.token }} --skip-duplicate

      - name: NuGet login (OIDC to temporary API key)
        if: env.NUGET_USER != ''
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet package
        if: steps.nuget-login.outputs.NUGET_API_KEY != ''
        env:
          NuGetDirectory: ./artifacts
        run: |
          foreach($file in (Get-ChildItem "${{ env.NuGetDirectory }}" -Recurse -Include *.nupkg)) {
              dotnet nuget push $file --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
          }
